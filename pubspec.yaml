name: pac_dart
description: "Paclingo — treinador de digitação que ensina Dart, Flutter, C# e inglês."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  google_fonts: ^7.1.0
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  # iframe do DartPad (só usado no build web, via import condicional)
  web: ^1.1.0
  http: ^1.6.0
  audioplayers: ^6.7.1
  url_launcher: ^6.3.3
  speech_to_text: ^7.4.0
  firebase_ai: ^2.3.0
  fsrs: ^2.0.1
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  # 🎓 o PDF do certificado (o QR vem junto, pelo barcode)
  pdf: ^3.12.0
  # o pdf 3.12 trava o archive em 4.0.9, e o image 4.11 usa uma API do archive 4.0.10+: fica abaixo dele
  image: ">=4.3.0 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculo.json
    - assets/master.json
    - assets/roda.json
    - assets/backgrounds/
    - assets/brand/
    - assets/csharp/
    - assets/ingles/
    - assets/ingles/historias/
    - assets/ingles/aulas/
    - assets/ingles/fotos/
    # as fontes do app no PDF do certificado (Archivo e Funnel Display, SIL OFL 1.1)
    - assets/fonts/
    # voz gerada por personagem (Google Cloud TTS — tools/ingles/vozes_google.py)
    - assets/ingles/voz/
    - assets/ingles/vozes.json
    # falas da história do Turismo, voz por personagem (mesmo script; índice assets/ingles/vozes_historia.json)
    - assets/ingles/voz_historia/
