name: triagem_jev
description: "Protótipo de triagem de estudos: modelo de decisão (Jev) faz o grosso, LLM explica o que sobrou, o pesquisador decide."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  http: ^1.6.0
  file_picker: ^13.3.0
  # download do JSON/CSV no navegador (import condicional em core/util/salvar_texto.dart)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exemplo_triagem.json
    - assets/precos.json
